<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-4 -4 244 244">
  <!-- NadheWedd fallback floral corner (top-left orientation). Replaced automatically
       by floral-*.webp when those files exist in src/assets/floral/. -->
  <defs>
    <radialGradient id="petal" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#7d2a2a"/>
      <stop offset=".45" stop-color="#b8665f"/>
      <stop offset="1" stop-color="#e9bfb2"/>
    </radialGradient>
    <radialGradient id="petalSoft" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#b9705f"/>
      <stop offset=".5" stop-color="#deaa98"/>
      <stop offset="1" stop-color="#f6dccd"/>
    </radialGradient>
    <g id="rose">
      <circle r="30" fill="url(#petal)"/>
      <path d="M-29 4C-27-17-8-31 12-26 26-21 31-6 27 9" fill="none" stroke="#f6dcd0" stroke-width="2.2" stroke-linecap="round" opacity=".85"/>
      <path d="M-27 12C-18 27 8 32 25 18" fill="none" stroke="#f3d2c4" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      <path d="M-18 3C-16-12-2-19 9-15 18-11 19 0 14 7" fill="none" stroke="#6e2222" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      <path d="M-9 4C-9-5 0-9 6-5 10-1 8 5 2 6" fill="none" stroke="#5d1a1a" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
      <path d="M-14 12C-6 18 8 17 15 10" fill="none" stroke="#f0c7b8" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    </g>
    <g id="roseSoft">
      <circle r="30" fill="url(#petalSoft)"/>
      <path d="M-28 5C-26-16-8-30 12-25 26-20 30-5 26 9" fill="none" stroke="#fff1e8" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
      <path d="M-16 3C-14-11-1-17 9-13 17-9 17 1 12 7" fill="none" stroke="#a35a4c" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>
      <path d="M-7 3C-7-4 1-7 5-3 8 0 6 5 1 5" fill="none" stroke="#8b4436" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    </g>
    <g id="leaf">
      <path d="M0 0C12-9 32-10 48 0 32 10 12 9 0 0Z" fill="#8d9a78"/>
      <path d="M2 0C18-1 32-1 46 0" fill="none" stroke="#6c7a58" stroke-width=".9" opacity=".8"/>
    </g>
    <g id="leafDark">
      <path d="M0 0C12-8 30-9 44 0 30 9 12 8 0 0Z" fill="#6f7f5e"/>
      <path d="M2 0C16-1 30-1 42 0" fill="none" stroke="#56653f" stroke-width=".9" opacity=".8"/>
    </g>
    <g id="blossom">
      <g fill="#f7e2d3" stroke="#e2bba6" stroke-width=".6">
        <ellipse cx="0" cy="-6" rx="4" ry="6"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(288)"/>
      </g>
      <circle r="2.4" fill="#c9a646"/>
    </g>
    <g id="bud">
      <path d="M0 0C-7-6-7-16 0-22 7-16 7-6 0 0Z" fill="#a8504a"/>
      <path d="M0 0C-5-3-9-8-8-12M0 0C5-3 9-8 8-12" fill="none" stroke="#6f7f5e" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- stems -->
  <g fill="none" stroke="#7c8a66" stroke-width="1.6" stroke-linecap="round">
    <path d="M-6 34C60 26 150 12 262 22"/>
    <path d="M34-6C26 60 14 150 22 262"/>
    <path d="M120 22C150 40 176 46 214 44" stroke-width="1.1"/>
    <path d="M24 120C40 150 46 176 44 214" stroke-width="1.1"/>
  </g>

  <!-- gold tendrils -->
  <g fill="none" stroke="#c9a646" stroke-width=".9" stroke-linecap="round" opacity=".9">
    <path d="M150 18c14-14 34-14 44-2 6 8 0 18-8 14"/>
    <path d="M18 150c-14 14-14 34-2 44 8 6 18 0 14-8"/>
    <path d="M96 92c18 6 30 20 30 38"/>
  </g>

  <!-- leaves along the top branch -->
  <use href="#leaf" xlink:href="#leaf" transform="translate(98 26) rotate(-24)"/>
  <use href="#leafDark" xlink:href="#leafDark" transform="translate(112 22) rotate(22) scale(.9)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(166 18) rotate(-18) scale(.85)"/>
  <use href="#leafDark" xlink:href="#leafDark" transform="translate(180 18) rotate(18) scale(.75)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(224 20) rotate(-10) scale(.65)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(150 36) rotate(30) scale(.6)"/>

  <!-- leaves along the left branch -->
  <use href="#leaf" xlink:href="#leaf" transform="translate(26 98) rotate(114)"/>
  <use href="#leafDark" xlink:href="#leafDark" transform="translate(22 112) rotate(68) scale(.9)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(18 166) rotate(108) scale(.85)"/>
  <use href="#leafDark" xlink:href="#leafDark" transform="translate(18 180) rotate(72) scale(.75)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(20 224) rotate(100) scale(.65)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(36 150) rotate(60) scale(.6)"/>

  <!-- leaves tucked behind the main cluster -->
  <use href="#leafDark" xlink:href="#leafDark" transform="translate(70 80) rotate(40) scale(1.1)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(84 62) rotate(10) scale(1)"/>
  <use href="#leaf" xlink:href="#leaf" transform="translate(62 84) rotate(80) scale(1)"/>

  <!-- buds -->
  <use href="#bud" xlink:href="#bud" transform="translate(206 20) rotate(70) scale(.9)"/>
  <use href="#bud" xlink:href="#bud" transform="translate(20 206) rotate(200) scale(.9)"/>
  <use href="#bud" xlink:href="#bud" transform="translate(214 44) rotate(100) scale(.65)"/>

  <!-- roses -->
  <use href="#roseSoft" xlink:href="#roseSoft" transform="translate(128 40) scale(.72)"/>
  <use href="#roseSoft" xlink:href="#roseSoft" transform="translate(40 128) scale(.68)"/>
  <use href="#rose" xlink:href="#rose" transform="translate(60 58) scale(1.25)"/>

  <!-- filler blossoms & gold dots -->
  <use href="#blossom" xlink:href="#blossom" transform="translate(104 70) scale(1.1)"/>
  <use href="#blossom" xlink:href="#blossom" transform="translate(70 104) scale(1)"/>
  <use href="#blossom" xlink:href="#blossom" transform="translate(150 54) scale(.8)"/>
  <use href="#blossom" xlink:href="#blossom" transform="translate(54 150) scale(.8)"/>
  <g fill="#c9a646">
    <circle cx="190" cy="40" r="1.8"/><circle cx="240" cy="36" r="1.4"/><circle cx="118" cy="100" r="1.6"/>
    <circle cx="40" cy="190" r="1.8"/><circle cx="36" cy="240" r="1.4"/><circle cx="100" cy="118" r="1.6"/>
    <circle cx="140" cy="70" r="1.2"/><circle cx="70" cy="140" r="1.2"/>
  </g>
</svg>
